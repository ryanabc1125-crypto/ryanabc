<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <linearGradient id="kefanfanGlobeGradDark" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Globe Symbol -->
  <g transform="translate(10, 0)">
    <!-- Layer 1 (Top Cap) -->
    <rect x="72" y="22" width="56" height="8" rx="4" fill="url(#kefanfanGlobeGradDark)" opacity="0.95" />
    <!-- Layer 2 -->
    <rect x="52" y="41" width="96" height="8.5" rx="4.25" fill="url(#kefanfanGlobeGradDark)" opacity="0.97" />
    <!-- Layer 3 -->
    <rect x="36" y="61" width="128" height="9" rx="4.5" fill="url(#kefanfanGlobeGradDark)" />
    
    <!-- Equatorial Ring Lens (Extends Outwards with Glowing Wings) -->
    <path d="M 8 80 C 48 66, 152 66, 192 80 C 152 94, 48 94, 8 80 Z" fill="url(#kefanfanGlobeGradDark)" />

    <!-- Layer 5 -->
    <rect x="36" y="99" width="128" height="9" rx="4.5" fill="url(#kefanfanGlobeGradDark)" />
    <!-- Layer 6 -->
    <rect x="52" y="119" width="96" height="8.5" rx="4.25" fill="url(#kefanfanGlobeGradDark)" opacity="0.97" />
    <!-- Layer 7 (Bottom Cap) -->
    <rect x="72" y="138" width="56" height="8" rx="4" fill="url(#kefanfanGlobeGradDark)" opacity="0.95" />
  </g>

  <!-- Brand Title "客番番" -->
  <text x="220" y="92" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="68" fill="#FFFFFF" letter-spacing="-1">客番番</text>

  <!-- Subtitle "专注海外获客 9 年" -->
  <text x="223" y="132" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="20" fill="#CBD5E1" letter-spacing="4">专注海外获客 9 年</text>
</svg>
